<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riwayat Karir</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <h1 class="logo">Sistem Informasi Alumni</h1>
        <ul class="nav-links">
          <li><a href="/alumni/dashboard">Dashboard</a></li>
          <li><a href="/alumni/profile">Profil</a></li>
          <li><a href="/alumni/career">Riwayat Karir</a></li>
          <li><a href="/logout">Logout</a></li>
        </ul>
      </div>
    </nav>

    <main>
      <div class="container">
        <div class="section">
          <h2>Riwayat Pekerjaan</h2>

          <div th:each="job, iterStat : ${alumni.jobExperience}" class="job-card">
            <h3 th:text="${job.jabatan} + ' di ' + ${job.company.name}">Jabatan</h3>
            <p>Industri: <span th:text="${job.industri}">Industri</span></p>
            <p>Perusahaan: <span th:text="${job.company.name}">Perusahaan</span></p>
            <p>Lokasi: <span th:text="${job.company.location}">Lokasi</span></p>
            <p>Periode: <span th:text="${#dates.format(job.startDate, 'dd-MM-yyyy')}">Start</span> - <span th:text="${job.endDate != null ? #dates.format(job.endDate, 'dd-MM-yyyy') : 'Sekarang'}">End</span></p>
            <form action="/alumni/career/delete/${iterStat.index}" method="post" style="display: inline">
              <button type="submit" class="btn btn-danger btn-sm">Hapus</button>
            </form>
            <hr />
          </div>

          <div th:if="${alumni.jobExperience.isEmpty()}" class="alert alert-info">Belum ada riwayat pekerjaan.</div>
        </div>

        <div class="section">
          <h2>Tambah Riwayat Pekerjaan Baru</h2>
          <form action="/alumni/career/add" method="post">
            <div class="form-group">
              <label for="idJobExperience">ID Pekerjaan</label>
              <input type="text" id="idJobExperience" name="idJobExperience" required />
            </div>

            <div class="form-group">
              <label for="industri">Industri</label>
              <select id="industri" name="industri" required>
                <option th:each="ind : ${industries}" th:value="${ind}" th:text="${ind}">Industri</option>
              </select>
            </div>

            <div class="form-group">
              <label for="jabatan">Jabatan</label>
              <input type="text" id="jabatan" name="jabatan" required />
            </div>

            <div class="form-group">
              <label for="companyId">Nama Perusahaan</label>
              <input type="text" id="companyId" name="companyId" required list="companyList" placeholder="Pilih atau ketik nama perusahaan" />
              <datalist id="companyList">
                <option th:each="comp : ${companies}" th:value="${comp.name}" th:text="${comp.name}"></option>
              </datalist>
            </div>

            <div class="form-group">
              <label for="startDate">Tanggal Mulai</label>
              <input type="date" id="startDate" name="startDate" required />
            </div>

            <div class="form-group">
              <label for="endDate">Tanggal Selesai (kosongkan jika masih bekerja)</label>
              <input type="date" id="endDate" name="endDate" />
            </div>

            <button type="submit" class="btn btn-primary">Tambah Riwayat</button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
