<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Alumni</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <h1 class="logo">Sistem Informasi Alumni</h1>
        <ul class="nav-links">
          <li><a href="/alumni/dashboard">Dashboard</a></li>
          <li><a href="/alumni/profile">Profil</a></li>
          <li><a href="/alumni/career">Riwayat Karir</a></li>
          <li><a href="/logout">Logout</a></li>
        </ul>
      </div>
    </nav>

    <main>
      <div class="container">
        <div class="form-container">
          <h2>Edit Profil</h2>
          <form action="/alumni/profile/update" method="post">
            <div class="form-group">
              <label for="name">Nama Lengkap</label>
              <input type="text" id="name" name="name" th:value="${alumni.name}" required />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" th:value="${alumni.email}" required />
            </div>

            <div class="form-group">
              <label for="major">Jurusan</label>
              <input type="text" id="major" th:value="${alumni.major}" disabled />
              <small class="text-muted">Jurusan tidak dapat diubah</small>
            </div>

            <div class="form-group">
              <label for="enrollmentYear">Angkatan</label>
              <input type="number" id="enrollmentYear" th:value="${alumni.enrollmentYear}" disabled />
              <small class="text-muted">Angkatan tidak dapat diubah</small>
            </div>

            <div class="form-group">
              <label for="password">Password Baru (kosongkan jika tidak diubah)</label>
              <input type="password" id="password" name="password" placeholder="******" />
            </div>

            <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
            <a href="/alumni/dashboard" class="btn btn-secondary">Kembali</a>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
